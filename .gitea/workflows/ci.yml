name: ci

on:
  push:
  pull_request:

# A newer push to the same branch replaces a run that is still queued or running: each run
# builds and tests the whole tree, so the newest one covers the older commits too.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-desktop:
    runs-on: linux-desktop
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Debug and Release builds, quality checks and complete CTest under headless Wayland
        run: sh tools/run-ci-linux.sh
      - name: Upload logs, JUnit and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-${{ github.sha }}
          path: |
            artifacts/linux-desktop
            artifacts/linux-desktop-release
